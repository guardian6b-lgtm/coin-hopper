<canvas id="c" width="960" height="540" tabindex="-1" aria-label="Coin Hopper game. Move with arrows or A and D. Jump with Space, W, or Up. Pause with P or Escape. Use your character ability with E."></canvas>
<button id="pause-button" type="button" hidden aria-label="Pause game">Pause</button>

</div>

</div>
<div id="menu" role="dialog" aria-modal="true" aria-labelledby="menu-title" aria-describedby="menu-description">

    <h1 id="menu-title"></h1>

<script>
"use strict";
const cv=document.getElementById('c'),cx=cv.getContext('2d');
const W=960,H=540,T=36,ROWS=15,DT=1/60;
const abilityButton=document.getElementById('ability-button'),abilityHud=document.getElementById('ability-hud'),
  abilityName=document.getElementById('ability-name'),abilityReadiness=document.getElementById('ability-readiness'),
  abilityMeter=document.getElementById('ability-meter'),abilityFill=document.getElementById('ability-fill'),
  abilityIcon=document.getElementById('ability-icon'),abilityButtonState=document.getElementById('ability-button-state');
let abilityHudInside=false;
const bossHud=document.getElementById('boss-hud'),bossName=document.getElementById('boss-name'),bossStatus=document.getElementById('boss-status'),bossHealth=document.getElementById('boss-health'),bossFill=document.getElementById('boss-health-fill');
window.onerror=(m)=>{cx.fillStyle='#000';cx.fillRect(0,0,W,40);cx.fillStyle='#f55';cx.font='16px sans-serif';cx.fillText('ERR: '+m,10,25);};
function fit(){const s=Math.min(innerWidth/W,innerHeight/H),left=(innerWidth-W*s)/2,top=(innerHeight-H*s)/2;
  cv.style.width=W*s+'px';cv.style.height=H*s+'px';abilityHudInside=top<58;
  abilityHud.style.top=(abilityHudInside?top+82*s:top-54)+'px';
  abilityButton.style.left=Math.max(8,Math.min(innerWidth-112,left+800*s-52))+'px';
  const buttonTop=abilityHudInside?top+300*s-28:top+H*s+12;
  abilityButton.style.top=Math.max(8,Math.min(innerHeight-64,buttonTop))+'px';
  const compactBoss=innerWidth<500&&abilityHudInside,bossWidth=compactBoss?innerWidth-136:Math.min(300,innerWidth-32);
  bossHud.style.width=bossWidth+'px';bossHud.style.left=(compactBoss?8:(innerWidth-bossWidth)/2)+'px';
  bossHud.dataset.compact=compactBoss?'1':'0';
  bossHud.style.top=(abilityHudInside?top+82*s+54:Math.max(8,top-114))+'px';
}
addEventListener('resize',fit);fit();

// ---------- Levels ----------
// # ground  = platform  o coin  e walker  h hopper  b shellback  s sentinel  S shield  ^ spikes  F flag  P start
const LEVELS=[

"############   ####   ####   ##########   #######   #########   ########   ##########",

{name:"Moonlit Gardens",sky:['#18264f','#775d9d'],map:[

"  P   S   o o   h     ^^     o     h =    ^^    e         S   h    ^^^     =h      ^^         e    o o  F",
"##########################  #########  ################  ###############   ###############   ###############",
"##########################  #########  ################  ###############   ###############   ###############"]},
{name:"Crystal Caverns",theme:"cavern",sky:['#132d54','#695c9c'],map:[

"  P    o o o     b  o o ^^ o      o o        o #  s   o o ^^ o      o o o  b #  s  o o o  ^^ o       o o  o  o b   #  s  o  ^ o       o       oo F",
"##############################  ################################  ##############################   ##############################   ################",
"##############################  ################################  ##############################   ##############################   ################"
]},
{name:"Skyline Summit",theme:"summit",sky:['#75c9fa','#f3e9d8'],boss:true,arenaStart:120,map:[
"",
"",

"     ooo            n                                                          o o  b o ^^ o e o    o o         oSo                ooo",
"    =====                                         o o h o o ^ o  o #  s o    ############################      =====",
"  P       o o  e o o       oo b   ^^ o #  s oo   #########################   ############################    oo      o  o  o  o  o  G     o  o  o  o F",
"######################   ######################  #########################   ############################   ############################################",
"######################   ######################  #########################   ############################   ############################################"
]}
];
let L,grid,LW,coins,enemies,shields,flag,start,parts;
function load(i){
  const src=LEVELS[i].map; const rows=Array(ROWS-src.length).fill('').concat(src);
  LW=Math.max(...rows.map(r=>r.length))+1;
  grid=rows.map(r=>r.padEnd(LW,' ').split(''));
  coins=[];enemies=[];shields=[];parts=[];bossState={required:!!LEVELS[i].boss,defeated:false};
  for(let y=0;y<ROWS-1;y++)for(let x=0;x<LW;x++)if(grid[y][x]==='^'&&!'#='.includes(grid[y+1][x]))grid[y][x]=' ';
  for(let y=0;y<ROWS;y++)for(let x=0;x<LW;x++){const c=grid[y][x];
    if(c==='o'){coins.push({x:x*T+T/2,y:y*T+T/2,t:Math.random()*6});grid[y][x]=' ';}
    else if(c==='e'){enemies.push(createEnemy('walker',x*T+4,y*T+8));grid[y][x]=' ';}
    else if(c==='h'){enemies.push(createEnemy('hopper',x*T+4,y*T+8));grid[y][x]=' ';}
    else if(c==='b'||c==='s'){const type=c==='b'?'shellback':'sentinel';enemies.push(createEnemy(type,x*T+4,(y+1)*T-ENEMY_TYPES[type].height));grid[y][x]=' ';}
    else if(c==='n'||c==='G'){const type=c==='n'?'nightwing':'guardian';enemies.push(createEnemy(type,x*T+4,(y+1)*T-ENEMY_TYPES[type].height));grid[y][x]=' ';}
    else if(c==='S'){shields.push({x:x*T+T/2,y:y*T+T/2,got:false});grid[y][x]=' ';}
    else if(c==='F'){flag={x:x*T,y:y*T};grid[y][x]=' ';for(let k=y+1;k<ROWS;k++)grid[k][x]='#';}
    else if(c==='P'){start={x:x*T+5,y:y*T};grid[y][x]=' ';}
  }
}
const isSolid=(tx,ty)=>{if(tx<0||tx>=LW)return true;if(ty<0||ty>=ROWS)return false;const c=grid[ty][tx];return c==='#'||c==='=';};
function collide(e,ax){
  const x0=Math.floor(e.x/T),x1=Math.floor((e.x+e.w-.01)/T),y0=Math.floor(e.y/T),y1=Math.floor((e.y+e.h-.01)/T);
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)if(isSolid(x,y)){
    if(ax==='x'){if(e.vx>0)e.x=x*T-e.w;else if(e.vx<0)e.x=(x+1)*T;return true;}
    else{if(e.vy>0){e.y=y*T-e.h;e.ground=true;}else if(e.vy<0)e.y=(y+1)*T;e.vy=0;return true;}
  }return false;
}

// ---------- Cosmetic roster ----------
// Appearance only. Simulation never reads these palettes or gives a character stats.
const CHARACTERS=Object.freeze([
  Object.freeze({id:'hopper',name:'Hopper',flavor:'A brave little hopper with a big heart',body:'#ff7da7',shade:'#cf4f7a',belly:'#ffe0ec',accent:'#ffdc70',tint:'#ffe6ed',cheek:'#f75f8d'}),
  Object.freeze({id:'minty',name:'Minty',flavor:'Agile, playful, always up for a challenge',body:'#83e6af',shade:'#359d7c',belly:'#e2fff0',accent:'#42bd91',tint:'#dff8e8',cheek:'#f692a6'}),
  Object.freeze({id:'ember',name:'Ember',flavor:'Energetic and bold with a fiery spirit',body:'#ffa16f',shade:'#cc6846',belly:'#fff0d4',accent:'#ffce63',tint:'#ffecd8',cheek:'#f47d68'}),
  Object.freeze({id:'nova',name:'Nova',flavor:'Dreamy, curious, reaching for the stars',body:'#bca7ff',shade:'#7e64b8',belly:'#f0eaff',accent:'#ffe690',tint:'#eee6ff',cheek:'#d18cce'}),
  Object.freeze({id:'bolt',name:'Bolt',flavor:'Always charged up and ready to go',body:'#ffe279',shade:'#d5a43e',belly:'#fff6ce',accent:'#249d9c',tint:'#fff3c9',cheek:'#f2a15f'})
]);
const characterById=id=>CHARACTERS.find(character=>character.id===id)||CHARACTERS[0];
let selectedCharacter='hopper',pendingCharacter='hopper';
try{const saved=localStorage.getItem('coinhopper_character_v1');if(CHARACTERS.some(character=>character.id===saved))selectedCharacter=saved;}catch(e){}
function beginCharacterSelect(){pendingCharacter=selectedCharacter;showMenu('characters','title');}
function confirmCharacter(){
  if(state!=='characters')return;
  selectedCharacter=pendingCharacter;
  try{localStorage.setItem('coinhopper_character_v1',selectedCharacter);}catch(e){}
  newGame();
}

// ---------- Sound ----------
const settings={music:.35,effects:.65};
try{const saved=JSON.parse(localStorage.getItem('coinhopper_settings'));
  for(const name of ['music','effects'])if(saved&&typeof saved[name]==='number'&&Number.isFinite(saved[name]))settings[name]=Math.max(0,Math.min(1,saved[name]));
}catch(e){}
let ac=null,effectsGain=null;
function saveSettings(){try{localStorage.setItem('coinhopper_settings',JSON.stringify(settings));}catch(e){}}
function applySettings(){if(effectsGain)effectsGain.gain.setValueAtTime(settings.effects,ac.currentTime);}
function audio(){if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)();effectsGain=ac.createGain();effectsGain.connect(ac.destination);applySettings();}catch(e){ac=null;effectsGain=null;}}
  if(ac&&ac.state==='suspended'){const result=ac.resume();if(result&&result.catch)result.catch(()=>{});}}
function snd(f,d,type='square',f2=null,vol=.12){if(!ac)return;const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;
  o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(effectsGain);o.start(t);o.stop(t+d);return o;}
const SFX={jump:()=>snd(330,.18,'square',660,.08),coin:()=>{snd(988,.08);setTimeout(()=>snd(1319,.15),70);},
 stomp:()=>snd(400,.15,'triangle',120,.2),hurt:()=>snd(300,.5,'sawtooth',60,.12),
 win:()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>snd(f,.2,'triangle',null,.15),i*130)),
 over:()=>[392,330,262,196].forEach((f,i)=>setTimeout(()=>snd(f,.3,'triangle',null,.15),i*200))};

// ---------- Input ----------
const keys={};let jumpEdge=false,anyEdge=false,abilityEdge=false;
const K={left:['ArrowLeft','KeyA'],right:['ArrowRight','KeyD'],jump:['Space','ArrowUp','KeyW']};
addEventListener('keydown',e=>{
  if(state!=='play'&&e.code==='Tab'){trapMenuFocus(e);return;}
  if(e.repeat)return;
  if(state==='characters'&&characterKey(e))return;
  if(state!=='play'&&e.code==='Escape'){e.preventDefault();backFromMenu();return;}
  if((e.code==='KeyP'||e.code==='Escape')&&(state==='play'||state==='pause')){e.preventDefault();togglePause();return;}
  if(state==='play'&&e.code==='KeyE'){audio();if(!keys.KeyE)abilityEdge=true;keys.KeyE=true;e.preventDefault();return;}
  // Native menu buttons and range controls keep their standard keyboard behavior.
  if(e.target&&e.target.closest&&e.target.closest('button,input,select,textarea,a'))return;
  audio();
  if(e.code==='KeyP'||e.code==='Escape'){e.preventDefault();togglePause();return;}
  if(state==='play'){
    if(!keys[e.code]&&K.jump.includes(e.code))jumpEdge=true;
    keys[e.code]=true;

// Stomps and every damaging power enter here. Legacy fixture actors lazily gain HP.
function damageEnemy(enemy,source,color='#9b5de5'){
  if(state!=='play'||!Object.hasOwn(ENEMY_DAMAGE,source)||!targetAlive(enemy)||enemy.hitTime>0)return false;
  if(enemy.type==='guardian'&&enemy.attackPhase!=='recover')return false;
  const spec=enemySpec(enemy);enemy.maxHealth??=spec.health;enemy.health??=enemy.maxHealth;
  if(enemy.health<=0)return false;
  enemy.health=Math.max(0,enemy.health-ENEMY_DAMAGE[source]);
  if(enemy.health>0){
    enemy.hitTime=ENEMY_COMBAT.hitGuard;enemy.hitFlash=ENEMY_COMBAT.hitFlash;
    enemyBurst(enemy.x+enemy.w/2,enemy.y+enemy.h/2,'#fff2ba',7);enemySound(520,.09,'triangle',260,.08);

function moveFlyer(enemy,vx,vy){
  const speed=Math.hypot(vx,vy),limit=ENEMY_TYPES.nightwing.diveSpeed;

function updateNightwing(enemy){
  const spec=ENEMY_TYPES.nightwing;
  if(enemy.x+enemy.w<cam-T||enemy.x>cam+W+T){resetNightwing(enemy);return;}
  enemy.attackTimer=tickDown(enemy.attackTimer);
  if(enemy.attackPhase==='charge'){
    if(!enemy.attackTimer){enemy.attackPhase='dive';enemy.attackTimer=spec.diveTime;enemySound(650,.14,'triangle',230,.07);}return;
  }
  if(enemy.attackPhase==='dive'){
    if(moveFlyer(enemy,enemy.aim.x*spec.diveSpeed,enemy.aim.y*spec.diveSpeed)||!enemy.attackTimer){enemy.attackPhase='return';enemy.attackTimer=2;}
    return;

  if(enemy.attackPhase==='return'){
    const dx=enemy.homeX-enemy.x,dy=enemy.homeY-enemy.y,dist=Math.hypot(dx,dy),speed=Math.min(spec.returnSpeed,dist/DT);
    const blocked=dist>1&&moveFlyer(enemy,dx/dist*speed,dy/dist*speed);
    if(dist<=2||blocked||!enemy.attackTimer){
      // Re-anchor at a collision-safe perch if terrain obstructs the return.
      enemy.homeX=enemy.x;enemy.homeY=enemy.y;enemy.flyTime=0;enemy.attackPhase='patrol';enemy.attackTimer=spec.recovery;enemy.aim=null;
    }return;
  }
  enemy.flyTime+=DT;const t=enemy.flyTime*Math.PI*2/spec.period;
  const tx=enemy.homeX+Math.sin(t)*spec.patrolRange,ty=enemy.homeY+Math.sin(t*2)*spec.patrolHeight;
  moveFlyer(enemy,(tx-enemy.x)/DT,(ty-enemy.y)/DT);
  const dx=pl.x+pl.w/2-enemy.x-enemy.w/2,dy=pl.y+pl.h/2-enemy.y-enemy.h/2,dist=Math.hypot(dx,dy);
  if(!enemy.attackTimer&&dist>0&&dist<=spec.range&&clearAbilityLine(enemy.x+enemy.w/2,enemy.y+enemy.h/2,pl.x+pl.w/2,pl.y+pl.h/2)){
    enemy.aim={x:dx/dist,y:dy/dist};enemy.attackPhase='charge';enemy.attackTimer=spec.windup;enemy.vx=0;enemy.vy=0;
  }
}
function updateGuardian(enemy){
  const spec=ENEMY_TYPES.guardian,arena=(LEVELS[lvl].arenaStart??0)*T;
  if(pl.x+pl.w<arena||enemy.x+enemy.w<cam-T||enemy.x>cam+W+T){resetGuardian(enemy);return;}
  enemy.attackTimer=tickDown(enemy.attackTimer);if(enemy.attackTimer)return;
  const phaseTwo=enemy.health<=spec.phaseTwoHealth;
  if(enemy.attackPhase==='idle'){enemy.attackPhase='windup';enemy.attackTimer=phaseTwo?spec.phaseTwoWindup:spec.windup;enemySound(130,.2,'triangle',90,.08);}
  else if(enemy.attackPhase==='windup'){

  }else{enemy.attackPhase='idle';enemy.attackTimer=phaseTwo?spec.phaseTwoRest:spec.rest;}
}
function updateSentinel(enemy){
  const spec=ENEMY_TYPES.sentinel;
  if(enemy.x+enemy.w<cam-T||enemy.x>cam+W+T){resetSentinel(enemy);return;}
  enemy.attackTimer=tickDown(enemy.attackTimer);
  if(enemy.attackPhase==='charge'){
    if(enemy.attackTimer>0)return;
    if(enemyCombat.projectiles.length<ENEMY_COMBAT.shotLimit){
      enemyCombat.projectiles.push({owner:enemy,x:enemy.x+enemy.w/2,y:enemy.y+enemy.h/2,vx:enemy.aim.x*spec.shotSpeed,vy:enemy.aim.y*spec.shotSpeed,radius:spec.shotRadius,life:spec.shotLife});
      enemySound(380,.18,'triangle',190,.07);
    }
    enemy.attackPhase='wait';enemy.attackTimer=spec.cooldown;enemy.aim=null;return;
  }
  if(enemy.attackTimer>0||!enemy.ground)return;
  const x=enemy.x+enemy.w/2,y=enemy.y+enemy.h/2,tx=pl.x+pl.w/2,ty=pl.y+pl.h/2,dist=Math.hypot(tx-x,ty-y);

function updateEnemyProjectiles(){
  const kept=[],shots=enemyCombat.projectiles;
  const onScreen=shot=>shot.x+shot.radius>=cam-T&&shot.x-shot.radius<=cam+W+T;
  for(let i=0;i<shots.length;i++){
    const shot=shots[i];
    if(!targetAlive(shot.owner)||!onScreen(shot))continue;
    const tx=shot.x+shot.vx*DT,ty=shot.y+shot.vy*DT;
    const wall=abilityTrace(shot.x,shot.y,tx,ty,shot.radius,false);
    const hit=segmentEntry(shot.x,shot.y,tx,ty,pl.x-shot.radius,pl.y-shot.radius,pl.x+pl.w+shot.radius,pl.y+pl.h+shot.radius);
    if(hit<wall.t-1e-9||(wall.kind==='end'&&hit<=1)){
      // Consume even during player recovery; a shield absorbs exactly one shot.
      enemyCombat.projectiles=[...kept,...shots.slice(i+1)];
      if(hurt())return true;
      continue;
    }
    if(wall.kind==='wall'){enemyBurst(wall.x,wall.y,'#e2b7ff',4);continue;}
    shot.x=tx;shot.y=ty;shot.life=tickDown(shot.life);
    if(shot.life>0&&shot.y>-T&&shot.y<ROWS*T+T&&onScreen(shot))kept.push(shot);

function abilitySpec(){const id=pl?.character||selectedCharacter;return Object.hasOwn(ABILITIES,id)?ABILITIES[id]:ABILITIES.hopper;}
function resetAbility(){
  stopAbilitySounds();ability=freshAbility();abilityEdge=false;
  if(parts)parts=parts.filter(part=>!part.power);
  for(const enemy of enemies||[])delete enemy.root;
}
function abilityEffect(kind,data={},life=.25){
  ability.effects.push({kind,age:0,life,total:life,...data});
  if(ability.effects.length>64)ability.effects.shift();
}
function tickAbility(){
  ability.clock+=DT;ability.cooldown=tickDown(ability.cooldown);ability.cast=tickDown(ability.cast);
  if(ability.remaining>0){ability.remaining=tickDown(ability.remaining);if(!ability.remaining)ability.active='';}
  for(const fx of ability.effects){fx.age+=DT;fx.life=tickDown(fx.life);}
  ability.effects=ability.effects.filter(fx=>fx.life>0);
}
const targetAlive=enemy=>enemy.dead===0&&enemy.y<=ROWS*T+50;
// Continuous segment/AABB intersection avoids tunneling and makes wall ties win.
function segmentEntry(x,y,tx,ty,left,top,right,bottom){
  let near=0,far=1;
  for(const [origin,delta,min,max]of [[x,tx-x,left,right],[y,ty-y,top,bottom]]){
    if(Math.abs(delta)<1e-9){if(origin<min||origin>max)return Infinity;continue;}
    const a=(min-origin)/delta,b=(max-origin)/delta;
    near=Math.max(near,Math.min(a,b));far=Math.min(far,Math.max(a,b));
    if(near>far)return Infinity;
  }
  return near;
}
function abilityTrace(x,y,tx,ty,radius=0,includeEnemies=true){
  let result={kind:'end',t:1,x:tx,y:ty};
  const x0=Math.floor((Math.min(x,tx)-radius)/T),x1=Math.floor((Math.max(x,tx)+radius)/T);
  const y0=Math.floor((Math.min(y,ty)-radius)/T),y1=Math.floor((Math.max(y,ty)+radius)/T);
  for(let row=y0;row<=y1;row++)for(let col=x0;col<=x1;col++)if(isSolid(col,row)){
    const t=segmentEntry(x,y,tx,ty,col*T-radius,row*T-radius,(col+1)*T+radius,(row+1)*T+radius);
    if(t<=result.t)result={kind:'wall',t,x:x+(tx-x)*t,y:y+(ty-y)*t};
  }
  if(includeEnemies)for(const enemy of enemies)if(targetAlive(enemy)){
    const t=segmentEntry(x,y,tx,ty,enemy.x-radius,enemy.y-radius,enemy.x+enemy.w+radius,enemy.y+enemy.h+radius);

}
const clearAbilityLine=(x,y,tx,ty)=>abilityTrace(x,y,tx,ty,0,false).kind!=='wall';
function castSlam(spec){
  if(pl.ground)return false;

  powerSound(170,.22,'triangle',55,.17);return true;
}
function castSnare(spec){

  abilityEffect('vine',{x,y,tx:hit.x,ty:hit.y,color:spec.color},.24);

  hit.enemy.root=spec.duration;powerSound(560,.24,'sine',240,.13);return true;

function castFireball(spec){
  ability.projectiles.push({kind:'fire',x:pl.x+pl.w/2,y:pl.y+pl.h/2,vx:pl.face*spec.speed,life:spec.range/spec.speed,radius:spec.radius});
  powerSound(300,.18,'sawtooth',95,.1);return true;
}
function castGlide(spec){
  if(pl.ground)return false;
  ability.active='glide';ability.remaining=spec.duration;powerSound(740,.32,'sine',1047,.09);return true;
}
function castLightning(spec){
  const x=pl.x+pl.w/2,y=pl.y+pl.h/2,hit=abilityTrace(x,y,x+pl.face*spec.range,y);
  abilityEffect('lightning',{x,y,tx:hit.x,ty:hit.y,color:spec.color},.2);
  powerSound(1400,.14,'sawtooth',160,.12);
  if(hit.kind==='enemy'){
    const first=hit.enemy,cx=first.x+first.w/2,cy=first.y+first.h/2;
    damageEnemy(first,'lightning',spec.color);
    const candidates=enemies.filter(enemy=>targetAlive(enemy)&&enemy!==first)
      .map((enemy,index)=>({enemy,index,d:Math.hypot(enemy.x+enemy.w/2-cx,enemy.y+enemy.h/2-cy)}))
      .filter(candidate=>candidate.d<=spec.chainRange&&clearAbilityLine(cx,cy,candidate.enemy.x+candidate.enemy.w/2,candidate.enemy.y+candidate.enemy.h/2))
      .sort((a,b)=>a.d-b.d||a.index-b.index);
    if(candidates.length){const second=candidates[0].enemy;
      abilityEffect('lightning',{x:cx,y:cy,tx:second.x+second.w/2,ty:second.y+second.h/2,color:spec.color},.24);
      damageEnemy(second,'lightning',spec.color);

function useAbility(){
  if(state!=='play'||!pl||ability.cooldown>0||ability.active)return false;

}
function updateAbilityWorld(){
  if(ability.active==='glide'&&pl.ground){ability.active='';ability.remaining=0;}
  if(ability.active==='slam'&&pl.ground){
    const spec=ABILITIES.hopper,x=pl.x+pl.w/2,y=pl.y+pl.h-4;
    ability.active='';ability.remaining=0;
    abilityEffect('shockwave',{x,y,radius:spec.radius,color:spec.color},.32);
    powerSound(95,.2,'triangle',35,.2);
    for(const enemy of enemies)if(targetAlive(enemy)&&Math.hypot(enemy.x+enemy.w/2-x,enemy.y+enemy.h/2-y)<=spec.radius&&clearAbilityLine(x,y,enemy.x+enemy.w/2,enemy.y+enemy.h/2))damageEnemy(enemy,'slam',spec.color);
  }
  for(const shot of ability.projectiles){
    const hit=abilityTrace(shot.x,shot.y,shot.x+shot.vx*DT,shot.y,shot.radius);
    shot.x=hit.x;shot.y=hit.y;shot.life=tickDown(shot.life);
    if(hit.kind!=='end'){
      if(hit.kind==='enemy')damageEnemy(hit.enemy,'fireball',ABILITIES.ember.color);
      abilityEffect('impact',{x:hit.x,y:hit.y,color:ABILITIES.ember.color},.28);powerSound(180,.13,'triangle',65,.13);shot.life=0;
    }
  }

}
function requestAbility(e){

}

function saveBest(){if(score>best){best=score;try{localStorage.setItem('coinhopper_best',best);}catch(e){}}}
function togglePause(){if(state==='play')showMenu('pause');else if(state==='pause')resumeGame();}
function spawn(){resetAbility();resetEnemyCombat();pl={x:start.x,y:start.y,w:26,h:32,vx:0,vy:0,ground:false,coyote:0,buf:0,face:1,inv:1,squash:1,shield:false,character:selectedCharacter};cam=Math.max(0,pl.x-W/3);}
function startLevel(i){lvl=i;load(i);spawn();levelScore=0;timer=0;state='play';syncMenu();}
function newGame(){score=0;lives=3;startLevel(0);}
function burst(x,y,col,n=10){for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()-.5)*300,vy:-Math.random()*300,l:.6,col});}
// A handled hit ends this update; respawning replaces the player object.
// Pit falls bypass protection, including spawn/shield recovery invulnerability.
function hurt(fall=false){if(state!=='play'||(!fall&&pl.inv>0))return false;
  if(!fall&&pl.shield){pl.shield=false;pl.inv=1;SFX.stomp();burst(pl.x+13,pl.y+16,'#96f6ff',16);return true;}
  pl.shield=false;SFX.hurt();lives--;burst(pl.x+13,pl.y+16,'#ff6b6b',16);
  if(lives<=0){resetAbility();resetEnemyCombat();saveBest();state='over';SFX.over();syncMenu();}else spawn();return true;}

function update(){
  time+=DT;
  if(state!=='play'){
    if(anyEdge){if(state==='title')beginCharacterSelect();else if(state==='over')newGame();else if(state==='done')advanceLevel();else if(state==='win')showMenu('title');}
    anyEdge=false;jumpEdge=false;abilityEdge=false;return;}
  anyEdge=false;timer+=DT;tickAbility();tickEnemyCombat();
  const p=pl,acc=p.ground?2600:1700,max=260;
  const dir=(held('right')?1:0)-(held('left')?1:0);
  if(dir){p.vx+=dir*acc*DT;p.face=dir;}else{const f=(p.ground?2200:900)*DT;p.vx=Math.abs(p.vx)<f?0:p.vx-Math.sign(p.vx)*f;}
  p.vx=Math.max(-max,Math.min(max,p.vx));
  if(jumpEdge)p.buf=.13;jumpEdge=false;
  p.coyote=p.ground?.1:p.coyote-DT;p.buf-=DT;
  if(p.buf>0&&p.coyote>0){p.vy=-640;p.buf=0;p.coyote=0;p.ground=false;p.squash=.7;SFX.jump();}
  if(abilityEdge){abilityEdge=false;useAbility();}
  const g=(p.vy<0&&!held('jump'))?3800:1800;
  p.vy=Math.min(p.vy+g*DT,900);
  if(ability.active==='glide'&&p.vy>ABILITIES.nova.fallSpeed)p.vy=ABILITIES.nova.fallSpeed;
  p.x+=p.vx*DT;if(collide(p,'x'))p.vx=0;
  const wasG=p.ground;p.ground=false;p.y+=p.vy*DT;collide(p,'y');
  if(p.ground&&ability.active==='glide'){ability.active='';ability.remaining=0;}
  if(p.ground&&!wasG)p.squash=1.25;p.squash+=(1-p.squash)*.2;
  if(p.inv>0)p.inv-=DT;
  if(p.y>ROWS*T+50){hurt(true);return;}
  // A shield is optional, grants no points, and never stacks.
  for(const item of shields)if(!item.got&&!p.shield&&Math.abs(p.x+13-item.x)<26&&Math.abs(p.y+16-item.y)<30){
    item.got=true;p.shield=true;SFX.coin();burst(item.x,item.y,'#96f6ff',10);
  }
  // spikes
  const sx0=Math.floor((p.x+4)/T),sx1=Math.floor((p.x+p.w-4)/T),sy0=Math.floor((p.y+8)/T),sy1=Math.floor((p.y+p.h-1)/T);
  for(let y=sy0;y<=sy1;y++)for(let x=sx0;x<=sx1;x++)if(y>=0&&y<ROWS&&x>=0&&x<LW&&grid[y][x]==='^'&&p.y+p.h>y*T+T*.45){if(hurt())return;}
  // coins
  for(const c of coins)if(!c.got&&Math.abs(p.x+13-c.x)<24&&Math.abs(p.y+16-c.y)<28){c.got=1;score+=10;levelScore+=10;SFX.coin();burst(c.x,c.y,'#ffd84a',8);}
  updateAbilityWorld();
  // enemies
  for(const e of enemies){
    if(e.dead){e.dead-=DT;if(e.dead<=0)e.dead=-1;continue;}
    if(e.root>0)e.root=tickDown(e.root);
    else if(e.type==='nightwing')updateNightwing(e);
    else{
    e.vy=Math.min(e.vy+1800*DT,900);e.x+=e.vx*DT;if(collide(e,'x'))e.vx*=-1;
    e.ground=false;e.y+=e.vy*DT;collide(e,'y');
    if(e.ground){const fx=Math.floor((e.vx>0?e.x+e.w+1:e.x-1)/T),fy=Math.floor((e.y+e.h+2)/T);if(!isSolid(fx,fy))e.vx*=-1;}
    if(e.type==='hopper'){
      e.hop-=DT;
      if(e.ground&&e.hop<=0){e.vy=-ENEMY_TYPES.hopper.jumpSpeed;e.ground=false;e.hop=ENEMY_TYPES.hopper.hopGap;}
    }
    if(e.type==='sentinel')updateSentinel(e);
    if(e.type==='guardian')updateGuardian(e);
    }
    if(e.y>ROWS*T+50){e.dead=-1;continue;}
    if(p.x<e.x+e.w&&p.x+p.w>e.x&&p.y<e.y+e.h&&p.y+p.h>e.y){
      if(p.vy>0&&p.y+p.h-e.y<20){damageEnemy(e,'stomp');if(ability.active==='slam'){ability.active='';ability.remaining=0;}p.vy=held('jump')?-560:-380;SFX.stomp();}
      else if(hurt())return;}
  }
  enemies=enemies.filter(e=>e.dead>=0);
  if(updateEnemyProjectiles())return;
  for(const q of parts){q.vy+=900*DT;q.x+=q.vx*DT;q.y+=q.vy*DT;q.l-=DT;}parts=parts.filter(q=>q.l>0);
  // flag
  if((!bossState.required||bossState.defeated)&&p.x+p.w>flag.x+10){const bonus=Math.max(0,300-Math.floor(timer)*5);score+=100+bonus;levelScore+=100+bonus;pl.shield=false;resetAbility();resetEnemyCombat();saveBest();state='done';SFX.win();syncMenu();}
  const target=Math.max(0,Math.min(p.x-W/3,LW*T-W));cam+=(target-cam)*.12;
}

// ---------- Drawing ----------
function rr(x,y,w,h,r){cx.beginPath();cx.roundRect?cx.roundRect(x,y,w,h,r):cx.rect(x,y,w,h);}
function reducedMotion(){return window.matchMedia?.('(prefers-reduced-motion: reduce)')?.matches||false;}
function drawCavernBG(){
  const gradient=cx.createLinearGradient(0,0,0,H);gradient.addColorStop(0,'#142a53');gradient.addColorStop(1,'#71659d');cx.fillStyle=gradient;cx.fillRect(0,0,W,H);
  for(const [layer,color,size]of [[.12,'#263f6b',180],[.3,'#3e5780',140],[.48,'#536c88',100]]){
    cx.fillStyle=color;
    for(let i=-1;i<9;i++){
      const x=((i*size-cam*layer)%(W+size)+W+size)%(W+size)-size;
      cx.beginPath();cx.moveTo(x,0);cx.lineTo(x+size*.38,80+(i%3)*27);cx.lineTo(x+size*.7,18);cx.lineTo(x+size,0);cx.fill();
      cx.beginPath();cx.moveTo(x,H);cx.lineTo(x+size*.18,380-(i%3)*35);cx.lineTo(x+size*.6,275+(i%2)*35);cx.lineTo(x+size,H);cx.fill();
    }
  }
  for(let i=0;i<12;i++){
    const x=((i*139-cam*.22)%(W+170)+W+170)%(W+170)-80,y=215+(i*67)%170;
    cx.fillStyle=i%2?'#6cd7d0':'#a491da';cx.globalAlpha=.42;
    cx.beginPath();cx.moveTo(x,y-34);cx.lineTo(x+16,y-9);cx.lineTo(x+8,y+19);cx.lineTo(x-12,y+12);cx.lineTo(x-17,y-10);cx.closePath();cx.fill();
    cx.strokeStyle='#d7fbff';cx.lineWidth=1;cx.beginPath();cx.moveTo(x,y-31);cx.lineTo(x+2,y+12);cx.lineTo(x+12,y-8);cx.stroke();
  }
  const motion=reducedMotion();
  for(let i=0;i<16;i++){
    cx.globalAlpha=motion?.45:.25+.35*Math.abs(Math.sin(ability.clock*1.2+i));cx.fillStyle=i%2?'#cafbfa':'#fff0ba';
    const x=((i*137-cam*.15)%W+W)%W,y=120+(i*79)%235;cx.fillRect(x,y,2,2);
  }
  cx.globalAlpha=1;
}

  cx.fillStyle='#fff4bf';cx.beginPath();cx.arc(790-cam*.02,72,37,0,7);cx.fill();

  }
  for(let i=0;i<7;i++){
    const x=((i*240-cam*.28)%(W+280)+W+280)%(W+280)-140,y=275+(i%3)*65;
    cx.fillStyle='#8da6ba';cx.beginPath();cx.moveTo(x-55,y);cx.lineTo(x+55,y);cx.lineTo(x+29,y+54);cx.lineTo(x,y+84);cx.lineTo(x-39,y+49);cx.closePath();cx.fill();
    cx.fillStyle='#8dcd9d';cx.beginPath();cx.ellipse(x,y,57,15,0,0,7);cx.fill();

function drawBG(){
  if(LEVELS[lvl].theme==='cavern'){drawCavernBG();return;}
  if(LEVELS[lvl].theme==='summit'){drawSummitBG();return;}
  const s=LEVELS[lvl].sky,gr=cx.createLinearGradient(0,0,0,H);gr.addColorStop(0,s[0]);gr.addColorStop(1,s[1]);cx.fillStyle=gr;cx.fillRect(0,0,W,H);
  if(lvl===3){
    // A crescent, fireflies and rounded garden trees keep the arcade palette.
    const moonX=790-cam*.04;
    cx.fillStyle='#fff2ba';cx.beginPath();cx.arc(moonX,85,43,-1.1,1.1,true);
    cx.quadraticCurveTo(moonX-35,85,moonX+Math.cos(1.1)*43,85-Math.sin(1.1)*43);cx.fill();
    for(let i=0;i<36;i++){cx.globalAlpha=.35+.5*Math.abs(Math.sin(time*1.5+i));cx.fillStyle=i%2?'#b4ffe1':'#fff2ba';
      cx.beginPath();cx.arc(((i*137-cam*.18)%W+W)%W,100+(i*71)%260+Math.sin(time+i)*5,i%3?2:3,0,7);cx.fill();}cx.globalAlpha=1;
  }else if(lvl===2){cx.fillStyle='#fff';for(let i=0;i<60;i++){const x=((i*137-cam*.1)%W+W)%W,y=(i*73)%300;cx.globalAlpha=.4+.6*Math.abs(Math.sin(time*2+i));cx.fillRect(x,y,2,2);}cx.globalAlpha=1;
    cx.fillStyle='#fff8d0';cx.beginPath();cx.arc(780-cam*.05,90,40,0,7);cx.fill();}
  else{cx.fillStyle='#fff6a8';cx.beginPath();cx.arc(820-cam*.05,90,42,0,7);cx.fill();
    cx.fillStyle='rgba(255,255,255,.9)';for(let i=0;i<6;i++){const x=((i*260-cam*.2-time*8)%(W+300)+W+300)%(W+300)-150,y=60+(i%3)*45;
      cx.beginPath();cx.arc(x,y,24,0,7);cx.arc(x+28,y-10,30,0,7);cx.arc(x+58,y,22,0,7);cx.fill();}}
  const hc=lvl===3?['#354873','#365b6b']:lvl===2?['#2c2f6e','#3b3f8a']:lvl===1?['#d98b5f','#c97a4f']:['#8fd694','#6cc075'];
  [[.25,320,hc[0],140],[.5,380,hc[1],100]].forEach(([k,base,c,a])=>{cx.fillStyle=c;cx.beginPath();cx.moveTo(0,H);
    for(let x=0;x<=W;x+=20)cx.lineTo(x,base-Math.sin((x+cam*k)/a)*40-Math.sin((x+cam*k)/(a*.37))*15);cx.lineTo(W,H);cx.fill();});
  if(lvl===3)for(let i=0;i<8;i++){
    const x=((i*180-cam*.4)%(W+200)+W+200)%(W+200)-100;
    cx.fillStyle='#293e60';cx.fillRect(x-5,260,10,210);cx.fillStyle=i%2?'#416e78':'#4b6482';
    cx.beginPath();cx.ellipse(x,270,46,75,0,0,7);cx.fill();
  }
}
function drawTiles(){
  const x0=Math.floor(cam/T),x1=x0+Math.ceil(W/T)+1;
  for(let y=0;y<ROWS;y++)for(let x=x0;x<=x1&&x<LW;x++){const c=grid[y][x],px=Math.round(x*T-cam),py=y*T;
    if(LEVELS[lvl].theme==='cavern'&&(c==='#'||c==='=')){
      cx.fillStyle=c==='#'?'#4d6090':'#8daed0';cx.fillRect(px,py,T,T);cx.strokeStyle=c==='#'?'#35486d':'#4d739e';cx.lineWidth=2;cx.strokeRect(px+1,py+1,T-2,T-2);
      if(c==='='||!isSolid(x,y-1)){cx.fillStyle='#b5f3e4';cx.fillRect(px,py,T,7);cx.fillStyle='#68b8c5';cx.fillRect(px,py+7,T,3);}
      cx.strokeStyle=c==='#'?'#758db5':'#e0f9ff';cx.beginPath();cx.moveTo(px+7,py+26);cx.lineTo(px+15,py+13);cx.lineTo(px+27,py+27);cx.moveTo(px+15,py+13);cx.lineTo(px+17,py+31);cx.stroke();
    }else if(LEVELS[lvl].theme==='summit'&&(c==='#'||c==='=')){
      cx.fillStyle=c==='='?'#b9bad7':'#8e97ae';cx.fillRect(px,py,T,T);cx.strokeStyle='#66758f';cx.lineWidth=2;cx.strokeRect(px+1,py+1,T-2,T-2);
      cx.strokeStyle='#b8c5d7';cx.beginPath();cx.moveTo(px+8,py+28);cx.lineTo(px+20,py+14);cx.lineTo(px+31,py+27);cx.stroke();
      if(c==='='||!isSolid(x,y-1)){cx.fillStyle='#a5e3a5';cx.fillRect(px,py,T,8);cx.fillStyle='#71ba8b';cx.fillRect(px,py+8,T,4);}
    }else if(c==='#'){const top=y===0||!isSolid(x,y-1);cx.fillStyle=lvl===3?'#665a89':lvl===2?'#5b4a7a':'#9c6b3f';cx.fillRect(px,py,T,T);
      cx.fillStyle=lvl===3?'#514971':lvl===2?'#4a3b66':'#87592f';cx.fillRect(px+6,py+14,6,6);cx.fillRect(px+22,py+24,5,5);
      if(top){cx.fillStyle=lvl===3?'#8be3ba':lvl===2?'#7fd1c8':'#5ccf5c';cx.fillRect(px,py,T,10);cx.fillStyle=lvl===3?'#59ad9e':lvl===2?'#62b3aa':'#43b043';cx.fillRect(px,py+10,T,3);
        if(lvl===3&&x%3===0){cx.fillStyle='#ffd1ed';cx.beginPath();cx.arc(px+18,py+3,4,0,7);cx.fill();}}}
    else if(c==='='){cx.fillStyle=lvl===3?'#9b87b9':'#e07a3f';cx.fillRect(px,py,T,T);cx.strokeStyle=lvl===3?'#675286':'#a8512a';cx.lineWidth=2;
      cx.strokeRect(px+1,py+1,T-2,T-2);cx.beginPath();cx.moveTo(px,py+T/2);cx.lineTo(px+T,py+T/2);cx.moveTo(px+T/2,py);cx.lineTo(px+T/2,py+T/2);cx.stroke();}
    else if(c==='^'){cx.fillStyle='#d9dde6';cx.strokeStyle='#8a90a0';cx.lineWidth=2;for(let k=0;k<3;k++){cx.beginPath();cx.moveTo(px+k*12,py+T);cx.lineTo(px+k*12+6,py+T*.45);cx.lineTo(px+k*12+12,py+T);cx.closePath();cx.fill();cx.stroke();}}
  }
}
function drawShield(x,y){

// Shared portrait/game renderer. Coordinates are visual only; pl.w/pl.h never change.
function drawCharacter(ctx,id,x,y,w,h,face=1){
  const skin=characterById(id);
  ctx.save();ctx.translate(x,y);ctx.scale(w/30,h/32);ctx.lineJoin='round';ctx.lineCap='round';
  const body=ctx.createLinearGradient(0,-32,0,0);body.addColorStop(0,skin.body);body.addColorStop(1,skin.shade);
  ctx.fillStyle=body;ctx.strokeStyle=skin.shade;ctx.lineWidth=1.2;ctx.beginPath();
  if(ctx.roundRect)ctx.roundRect(-15,-32,30,32,11);else ctx.rect(-15,-32,30,32);ctx.fill();ctx.stroke();
  ctx.fillStyle=skin.belly;ctx.beginPath();ctx.ellipse(0,-8,10,6,0,0,7);ctx.fill();
  ctx.fillStyle='#fff';const ex=face*2;ctx.beginPath();ctx.ellipse(-5+ex,-22,5,6,0,0,7);ctx.ellipse(6+ex,-22,5,6,0,0,7);ctx.fill();
  ctx.fillStyle='#28374f';ctx.beginPath();ctx.arc(-5+ex+face,-22,2.4,0,7);ctx.arc(6+ex+face,-22,2.4,0,7);ctx.fill();
  ctx.fillStyle=skin.cheek;ctx.beginPath();ctx.ellipse(-10,-15,3,1.8,0,0,7);ctx.ellipse(10,-15,3,1.8,0,0,7);ctx.fill();
  ctx.strokeStyle='#4e4260';ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(-3,-13);ctx.quadraticCurveTo(0,-9,4,-13);ctx.stroke();
  ctx.fillStyle=skin.accent;ctx.strokeStyle=skin.accent;ctx.lineWidth=1.5;ctx.beginPath();
  if(skin.id==='hopper'){
    ctx.moveTo(-14,-30);ctx.lineTo(-12,-39);ctx.lineTo(-4,-35);ctx.lineTo(0,-42);ctx.lineTo(5,-35);ctx.lineTo(12,-39);ctx.lineTo(14,-30);ctx.closePath();
  }else if(skin.id==='minty'){
    ctx.moveTo(0,-30);ctx.quadraticCurveTo(-8,-45,10,-44);ctx.quadraticCurveTo(16,-31,0,-30);
  }else if(skin.id==='ember'){
    ctx.moveTo(-12,-30);ctx.quadraticCurveTo(-16,-38,-6,-44);ctx.quadraticCurveTo(-7,-34,2,-42);ctx.quadraticCurveTo(16,-37,12,-30);ctx.closePath();
  }else if(skin.id==='nova'){
    for(let i=0;i<10;i++){const angle=-Math.PI/2+i*Math.PI/5,r=i%2?4.5:9,px=Math.cos(angle)*r,py=-35+Math.sin(angle)*r;i?ctx.lineTo(px,py):ctx.moveTo(px,py);}ctx.closePath();
  }else{
    ctx.moveTo(-3,-44);ctx.lineTo(8,-44);ctx.lineTo(2,-36);ctx.lineTo(11,-36);ctx.lineTo(-4,-25);ctx.lineTo(-1,-34);ctx.lineTo(-10,-34);ctx.closePath();
  }
  ctx.fill();ctx.stroke();
  if(skin.id==='minty'){
    ctx.strokeStyle=skin.shade;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,-31);ctx.lineTo(6,-40);ctx.stroke();
  }else if(skin.id==='nova'){
    ctx.strokeStyle='#fff6dd';ctx.lineWidth=1.2;ctx.beginPath();
    for(const [sx,sy] of [[-12,-34],[13,-29]]){ctx.moveTo(sx-2,sy);ctx.lineTo(sx+2,sy);ctx.moveTo(sx,sy-2);ctx.lineTo(sx,sy+2);}ctx.stroke();
  }
  ctx.restore();
}
function drawPlayer(){const p=pl;
  if(p.shield){cx.strokeStyle='#96f6ff';cx.fillStyle='rgba(150,246,255,.12)';cx.lineWidth=3;cx.beginPath();cx.arc(p.x+13-cam,p.y+16,26+Math.sin(time*4),0,7);cx.fill();cx.stroke();}
  if(p.inv>0&&Math.floor(time*20)%2)return;
  const sw=1/p.squash,sh=p.squash;
  drawCharacter(cx,p.character,p.x-cam+p.w/2,p.y+p.h,p.w*sw+4,p.h*sh,p.face);
}
function drawArmoredEnemy(e){
  const x=e.x+e.w/2-cam,y=e.y+e.h;
  cx.save();cx.translate(x,y);cx.lineJoin='round';cx.lineCap='round';cx.lineWidth=2;
  if(e.dead)cx.scale(1.3,.3);
  if(e.type==='shellback'){
    cx.fillStyle='#79b99a';cx.strokeStyle='#355c58';rr(-18,-13,36,14,7);cx.fill();cx.stroke();
    cx.fillStyle='#3d8678';rr(-19,-4,12,6,3);cx.fill();rr(7,-4,12,6,3);cx.fill();
    cx.fillStyle=e.health<e.maxHealth?'#d3ae82':'#efc477';cx.strokeStyle='#776154';
    cx.beginPath();cx.ellipse(0,-15,18,14,0,Math.PI,Math.PI*2);cx.lineTo(18,-10);cx.lineTo(-18,-10);cx.closePath();cx.fill();cx.stroke();
    cx.strokeStyle='#b38254';cx.beginPath();cx.moveTo(-8,-26);cx.lineTo(-7,-11);cx.moveTo(7,-26);cx.lineTo(8,-11);cx.moveTo(-16,-19);cx.lineTo(16,-19);cx.stroke();
    if(e.health<e.maxHealth){
      cx.strokeStyle='#fff6d3';cx.lineWidth=4;cx.beginPath();cx.moveTo(1,-29);cx.lineTo(-4,-21);cx.lineTo(3,-18);cx.lineTo(-2,-11);cx.stroke();

// ---------- Ability art: animation uses simulation time, never wall-clock time ----------
function drawPowerSymbol(ctx,id,x,y,size){
  ctx.save();ctx.translate(x,y);ctx.scale(size/24,size/24);ctx.lineJoin='round';ctx.lineCap='round';ctx.lineWidth=2;
  ctx.fillStyle=ABILITIES[id].color;ctx.strokeStyle='#36516c';ctx.beginPath();
  if(id==='hopper'){ctx.moveTo(-10,5);ctx.lineTo(-11,-6);ctx.lineTo(-4,-2);ctx.lineTo(0,-10);ctx.lineTo(5,-2);ctx.lineTo(11,-6);ctx.lineTo(10,5);ctx.closePath();}
  else if(id==='minty'){ctx.moveTo(-7,9);ctx.quadraticCurveTo(-15,-13,10,-10);ctx.quadraticCurveTo(15,9,-7,9);}
  else if(id==='ember'){ctx.moveTo(0,10);ctx.quadraticCurveTo(-16,5,-6,-10);ctx.quadraticCurveTo(-5,0,1,-12);ctx.quadraticCurveTo(19,7,0,10);}
  else if(id==='nova'){for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,r=i%2?5:11;i?ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r):ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r);}ctx.closePath();}
  else{ctx.moveTo(-3,-11);ctx.lineTo(9,-11);ctx.lineTo(3,-2);ctx.lineTo(11,-2);ctx.lineTo(-7,12);ctx.lineTo(-3,2);ctx.lineTo(-11,2);ctx.closePath();}
  ctx.fill();ctx.stroke();ctx.restore();
}
function syncAbilityUI(){
  const playing=state==='play'&&!!pl,spec=abilitySpec();
  abilityHud.hidden=!playing;abilityButton.hidden=!playing;abilityButton.disabled=!playing||ability.cooldown>0;
  if(!playing)return;
  const ready=ability.cooldown<=0,airborne=ready&&pl.ground&&['hopper','nova'].includes(pl.character);
  const status=ready?(airborne?'Jump first · E':'Ready · E'):ability.cooldown.toFixed(1)+'s';
  abilityName.textContent=characterById(pl.character).name+' · '+spec.name;
  abilityReadiness.textContent=status;abilityButtonState.textContent=ready?(airborne?'Jump + E':'E · Ready'):ability.cooldown.toFixed(1)+'s';
  abilityButton.setAttribute('aria-label','Use '+spec.name+(['hopper','nova'].includes(pl.character)?' while airborne. ':'. ')+(ready?'Ready.':'Cooldown '+ability.cooldown.toFixed(1)+' seconds.'));
  abilityButton.title=spec.name+' (E)'+(['hopper','nova'].includes(pl.character)?' — use while airborne':'');
  const percent=Math.round(100*(1-ability.cooldown/spec.cooldown));
  abilityMeter.setAttribute('aria-valuenow',String(percent));abilityMeter.setAttribute('aria-valuetext',status);
  abilityFill.style.width=percent+'%';abilityFill.style.background=spec.color;
  if(abilityIcon.dataset.character!==pl.character){
    abilityIcon.dataset.character=pl.character;
    const context=abilityIcon.getContext('2d');context.clearRect(0,0,32,32);drawPowerSymbol(context,pl.character,16,16,25);
  }
}
function syncBossUI(){
  const show=state==='play'&&pl&&bossState.required&&pl.x+pl.w>=(LEVELS[lvl].arenaStart??0)*T;
  bossHud.hidden=!show;if(!show)return;
  const boss=enemies.find(enemy=>enemy.type==='guardian'),maximum=boss?.maxHealth??ENEMY_TYPES.guardian.health,health=bossState.defeated?0:boss?.health??maximum;
  const phase=health<=ENEMY_TYPES.guardian.phaseTwoHealth?2:1,status=bossState.defeated?'Defeated · exit open':boss?.root>0?'Snared · attack timing paused':boss?.attackPhase==='recover'?'Recovery · stomp now':boss?.attackPhase==='windup'?'Warning · ground slam soon':'Guarding · wait for opening';
  const compact=bossHud.dataset.compact==='1',key=health+'|'+maximum+'|'+phase+'|'+status+'|'+compact;
  if(bossHud.dataset.state!==key){
    bossHud.dataset.state=key;bossName.textContent=compact?'Guardian · '+health+'/'+maximum+' · P'+phase:'Stone Guardian · '+health+' / '+maximum+' · Phase '+phase;bossStatus.textContent=status;
    bossHealth.setAttribute('aria-valuemax',String(maximum));bossHealth.setAttribute('aria-valuenow',String(health));bossHealth.setAttribute('aria-valuetext',health+' of '+maximum+'. '+status);

}
function drawAbilityEffects(){
  cx.save();cx.lineCap='round';cx.lineJoin='round';
  for(const enemy of enemies)if(targetAlive(enemy)&&enemy.root>0){
    const x=enemy.x+enemy.w/2-cam,y=enemy.y+enemy.h;
    cx.strokeStyle='#70d99a';cx.lineWidth=4;
    for(let i=0;i<2;i++){cx.beginPath();cx.ellipse(x,y-7-i*12,20,5,Math.sin(ability.clock*3)*.1,0,7);cx.stroke();}
    cx.fillStyle='#b8f29d';cx.beginPath();cx.ellipse(x-20,y-10,7,3,-.6,0,7);cx.ellipse(x+19,y-22,7,3,.6,0,7);cx.fill();
  }
  for(const shot of ability.projectiles){
    const x=shot.x-cam,y=shot.y,face=Math.sign(shot.vx);
    cx.fillStyle='#ffbd57';cx.beginPath();cx.moveTo(x-face*25,y-7);cx.quadraticCurveTo(x-face*12,y,x-face*25,y+7);cx.lineTo(x,y);cx.fill();
    cx.fillStyle='#f97543';cx.beginPath();cx.arc(x,y,10+Math.sin(ability.clock*24),0,7);cx.fill();
    cx.fillStyle='#fff0a4';cx.beginPath();cx.arc(x+face*2,y-2,5,0,7);cx.fill();
  }
  for(const fx of ability.effects){
    const t=fx.age/fx.total,x=fx.x-cam,y=fx.y;cx.globalAlpha=Math.min(1,fx.life/fx.total*2);
    if(fx.kind==='lightning'){
      for(const [width,color]of [[7,'#3688bd'],[3,fx.color]]){
        cx.lineWidth=width;cx.strokeStyle=color;cx.beginPath();cx.moveTo(x,y);
        for(let i=1;i<=8;i++){const k=i/8;cx.lineTo(x+(fx.tx-fx.x)*k,y+(fx.ty-fx.y)*k+(i===8?0:(i%2?1:-1)*7));}cx.stroke();
      }
    }else if(fx.kind==='vine'){
      const k=Math.min(1,t*4),tx=x+(fx.tx-fx.x)*k,ty=y+(fx.ty-fx.y)*k;
      cx.strokeStyle=fx.color;cx.lineWidth=5;cx.beginPath();cx.moveTo(x,y);cx.quadraticCurveTo((x+tx)/2,y-24,tx,ty);cx.stroke();
      cx.fillStyle='#c5f6a7';cx.beginPath();cx.ellipse(tx,ty,7,4,-.5,0,7);cx.fill();
    }else if(fx.kind==='shockwave'){
      cx.strokeStyle=fx.color;cx.lineWidth=5*(1-t)+1;cx.beginPath();cx.ellipse(x,y,Math.max(1,fx.radius*t),9+12*t,0,0,7);cx.stroke();
      for(let i=0;i<7;i++){const a=Math.PI+i*Math.PI/6;cx.fillStyle='#fff0ad';cx.fillRect(x+Math.cos(a)*fx.radius*t,y+Math.sin(a)*35*t,4,4);}
    }else{
      cx.strokeStyle=fx.color;cx.lineWidth=4;cx.beginPath();cx.arc(x,y,5+23*t,0,7);cx.stroke();
      for(let i=0;i<6;i++){const a=i*Math.PI/3;cx.fillStyle=fx.color;cx.fillRect(x+Math.cos(a)*28*t-2,y+Math.sin(a)*28*t-2,4,4);}
    }
  }
  cx.globalAlpha=1;
  if(pl){const x=pl.x+pl.w/2-cam,y=pl.y+pl.h/2;
    if(ability.active==='slam'){
      cx.strokeStyle='#ffe17b';cx.lineWidth=3;
      for(const dx of [-17,0,17]){cx.beginPath();cx.moveTo(x+dx,y-50);cx.lineTo(x+dx,y-27);cx.stroke();}

      drawPowerSymbol(cx,'nova',x,y-35,13);
    }
    if(ability.cast>0){cx.strokeStyle=abilitySpec().color;cx.lineWidth=3;cx.beginPath();cx.arc(x+pl.face*20,y,8+ability.cast*24,0,7);cx.stroke();}
  }
  cx.restore();
}

// ---------- Menus ----------
const menu=document.getElementById('menu'),menuTitle=document.getElementById('menu-title'),
  menuDescription=document.getElementById('menu-description'),menuContent=document.getElementById('menu-content'),
  menuActions=document.getElementById('menu-actions'),pauseButton=document.getElementById('pause-button');
let menuReturn='title',menuItems=[];
function showMenu(screen,returnTo=menuReturn){if(screen==='title'){lvl=0;load(0);pl=null;cam=0;resetAbility();resetEnemyCombat();}state=screen;menuReturn=returnTo;syncMenu();}
function resumeGame(){state='play';syncMenu();}
function requestRestart(){showMenu('restart','pause');}
function confirmRestart(){
  if(state!=='restart')return;
  const keptScore=score-levelScore,remainingLives=lives;
  startLevel(lvl);score=keptScore;lives=remainingLives;
}
function advanceLevel(){
  if(lvl+1<LEVELS.length)startLevel(lvl+1);
  else{saveBest();state='win';SFX.win();syncMenu();}
}
function backFromMenu(){
  if(state==='pause')resumeGame();
  else if(state==='restart')showMenu('pause');
  else if(state==='characters')showMenu('title','title');
  else if(state==='settings'||state==='controls')showMenu(menuReturn);
}
function activateMenuAction(action){
  audio();
  if(action==='play')beginCharacterSelect();
  else if(action==='start-character')confirmCharacter();
  else if(action==='retry')newGame();
  else if(action==='resume')resumeGame();
  else if(action==='restart')requestRestart();
  else if(action==='confirm-restart')confirmRestart();
  else if(action==='cancel-restart')showMenu('pause');
  else if(action==='next')advanceLevel();
  else if(action==='title'){saveBest();showMenu('title','title');}
  else if(action==='controls'||action==='settings')showMenu(action,state==='pause'?'pause':'title');
  else if(action==='back')backFromMenu();
}
function menuButton(label,action,primary=false){
  const button=document.createElement('button');button.type='button';button.className='menu-button'+(primary?' primary':'');
  const screen=state;button.textContent=label;button.addEventListener('click',()=>{if(state===screen)activateMenuAction(action);});
  menuActions.appendChild(button);menuItems.push(button);
}
function menuParagraph(text){const p=document.createElement('p');p.textContent=text;menuContent.appendChild(p);}
function volumeControl(name,label){
  const row=document.createElement('label');row.className='setting';row.htmlFor=name+'-volume';
  const text=document.createElement('span');text.textContent=label;
  const value=document.createElement('output');value.textContent=Math.round(settings[name]*100)+'%';value.htmlFor=name+'-volume';
  const input=document.createElement('input');input.type='range';input.id=name+'-volume';input.min='0';input.max='100';input.step='5';input.value=String(Math.round(settings[name]*100));
  input.setAttribute('aria-label',label);
  input.addEventListener('input',()=>{settings[name]=Math.max(0,Math.min(100,Number(input.value)))/100;value.textContent=Math.round(settings[name]*100)+'%';applySettings();saveSettings();});
  row.appendChild(text);row.appendChild(value);row.appendChild(input);menuContent.appendChild(row);menuItems.push(input);
}
function chooseCharacter(id,focus=false){
  if(state!=='characters'||!CHARACTERS.some(character=>character.id===id))return;
  pendingCharacter=id;
  for(const button of menuContent.querySelectorAll('[data-character]')){
    const chosen=button.dataset.character===id;
    button.setAttribute('aria-pressed',String(chosen));button.classList.toggle('selected',chosen);
    button.querySelector('[data-status]').textContent=chosen?'Selected':'Select';
    if(chosen&&focus)button.focus();
  }
  document.getElementById('character-choice').textContent=characterById(id).name+' selected. Ability: '+ABILITIES[id].name+' (E).';
}
function characterKey(e){
  if(!e.target?.closest?.('[data-character]'))return false;
  const index=CHARACTERS.findIndex(character=>character.id===e.target.closest('[data-character]').dataset.character);
  let next;
  if(e.code==='ArrowLeft')next=(index+CHARACTERS.length-1)%CHARACTERS.length;
  else if(e.code==='ArrowRight')next=(index+1)%CHARACTERS.length;
  else if(e.code==='Home')next=0;
  else if(e.code==='End')next=CHARACTERS.length-1;
  else return false;
  e.preventDefault();chooseCharacter(CHARACTERS[next].id,true);return true;
}
function characterCards(){
  const grid=document.createElement('div');grid.className='character-grid';grid.setAttribute('role','group');grid.setAttribute('aria-label','Playable characters');
  for(const character of CHARACTERS){
    const button=document.createElement('button');button.type='button';button.id='character-'+character.id;
    button.className='character-card';button.setAttribute('data-character',character.id);button.setAttribute('aria-label',character.name);
    button.setAttribute('aria-describedby',character.id+'-flavor '+character.id+'-power');
    const badge=document.createElement('span');badge.className='character-status';badge.setAttribute('data-status','');
    const portrait=document.createElement('canvas');portrait.width=120;portrait.height=120;portrait.setAttribute('aria-hidden','true');
    const context=portrait.getContext('2d');context.fillStyle=character.tint;context.beginPath();context.arc(60,59,48,0,7);context.fill();
    context.fillStyle='#bd9c81';context.beginPath();context.moveTo(27,105);context.quadraticCurveTo(34,117,42,118);context.lineTo(78,118);context.quadraticCurveTo(86,116,93,105);context.fill();
    context.fillStyle='#86d6a2';context.beginPath();context.ellipse(60,104,33,6,0,0,7);context.fill();
    drawCharacter(context,character.id,60,103,61,65);
    const name=document.createElement('span');name.className='character-name';name.textContent=character.name;
    const flavor=document.createElement('span');flavor.className='character-flavor';flavor.id=character.id+'-flavor';flavor.textContent=character.flavor;
    const power=document.createElement('span');power.id=character.id+'-power';power.className='character-power';power.textContent=ABILITIES[character.id].name+' · E';
    button.append(badge,portrait,name,flavor,power);button.addEventListener('click',()=>{audio();chooseCharacter(character.id);});
    grid.appendChild(button);menuItems.push(button);
  }
  menuContent.appendChild(grid);
  const status=document.createElement('p');status.id='character-choice';status.setAttribute('role','status');status.setAttribute('aria-live','polite');menuContent.appendChild(status);
  chooseCharacter(pendingCharacter);
}
function trapMenuFocus(e){
  if(!menuItems.length)return;
  e.preventDefault();const index=menuItems.indexOf(document.activeElement);
  const next=index<0?(e.shiftKey?menuItems.length-1:0):(index+(e.shiftKey?-1:1)+menuItems.length)%menuItems.length;
  menuItems[next].focus();
}
function syncMenu(){
  clearInput();menu.setAttribute('data-screen',state);const playing=state==='play';menu.hidden=playing;pauseButton.hidden=playing?touchMode:true;
  cv.tabIndex=playing?0:-1;cv.setAttribute('aria-hidden',playing?'false':'true');
  syncAbilityUI();syncBossUI();if(!playing){stopAbilitySounds();stopEnemySounds();}
  if(playing){cv.focus();return;}
  menuContent.replaceChildren();menuActions.replaceChildren();menuItems=[];
  const titles={title:'COIN HOPPER',characters:'Choose Your Hopper',pause:'Paused',controls:'How to play',settings:'Sound settings',restart:'Restart this level?',done:'Level complete!',over:'Game over',win:'You win!'};
  const descriptions={
    title:'Jump, stomp, and grab every coin!',
    characters:'Shared moves. Five special powers. Choose with a tap or Left / Right; use Tab to reach Start game.',
    pause:'Take a breather. Your run is paused.',
    controls:'A short hop or a big leap. You choose.',
    settings:'Adjust the sound to suit you.',
    restart:'Your points and coins from this level will reset. Your remaining lives stay the same.',
    done:LEVELS[lvl].name+' complete.',
    over:'Ready for another run?',
    win:'All '+LEVELS.length+' levels complete. Nicely done!'
  };
  menuTitle.textContent=titles[state]||'Coin Hopper';menuDescription.textContent=descriptions[state]||'';
  if(state==='title'){
    menuParagraph('Best score: '+best);menuParagraph('Your hopper: '+characterById(selectedCharacter).name+' · '+ABILITIES[selectedCharacter].name);
    menuButton('Play','play',true);menuButton('Controls','controls');menuButton('Settings','settings');
  }else if(state==='characters'){
    characterCards();menuButton('Start game','start-character',true);menuButton('Back','back');
  }else if(state==='pause'){
    menuButton('Resume','resume',true);menuButton('Restart level','restart');menuButton('Controls','controls');menuButton('Settings','settings');menuButton('Title screen','title');
  }else if(state==='controls'){
    menuParagraph('Move: Arrow keys or A / D.');
    menuParagraph('Jump: Space, W, or Up. Hold for a higher jump. Land on enemies to stomp them.');
    menuParagraph('Ability: E or the Ability button. Hopper slams in the air; Minty snares a facing enemy; Ember fires; Nova glides in the air; Bolt chains lightning. Cooldowns pause with the game.');
    menuParagraph('Mint leaf-eared hoppers leap on a steady beat. Stomp them for 50 points, like other enemies.');
    menuParagraph('Cyan shields absorb one enemy or spike hit, then give a moment to escape. They do not stack or protect against pits. Protection resets on death or when a level starts.');
    menuParagraph('Pause: P or Escape, or use Pause on screen. On phones, use the arrow and jump buttons.');
    menuParagraph('Use Tab to move between menu controls, Enter or Space to choose, and Escape to go back.');
    menuButton('Back','back',true);
  }else if(state==='settings'){
    volumeControl('effects','Sound effects');
    volumeControl('music','Music volume');
    menuParagraph('Music is coming soon. Your volume choice is saved.');
    menuButton('Back','back',true);
  }else if(state==='restart'){
    menuButton('Cancel','cancel-restart',true);menuButton('Restart level','confirm-restart');
  }else if(state==='done'){
    menuParagraph('Coins: '+coins.filter(c=>c.got).length+' / '+coins.length);
    menuParagraph('Level points: '+levelScore+'   Total score: '+score);
    menuButton(lvl+1<LEVELS.length?'Next level':'Finish','next',true);menuButton('Title screen','title');
  }else if(state==='over'){
    menuParagraph('Score: '+score+'   Best: '+best);
    menuButton('Try again','retry',true);menuButton('Title screen','title');
  }else if(state==='win'){
    menuParagraph('Final score: '+score+'   Best: '+best);
    menuButton('Title screen','title',true);
  }
  const focusIndex=state==='characters'?CHARACTERS.findIndex(character=>character.id===pendingCharacter):0;
  menuItems[focusIndex]?.focus();
}
pauseButton.addEventListener('click',()=>{audio();if(state==='play')showMenu('pause','pause');});
menu.addEventListener('pointerdown',e=>{if(e.pointerType==='touch')touchMode=true;});
menu.addEventListener('touchstart',()=>{touchMode=true;},{passive:true});

// ---------- Loop: fixed 60 Hz step ----------
let last=performance.now(),accum=0;
function frame(now){accum+=Math.min(.25,(now-last)/1000);last=now;
  while(accum>=DT){update();accum-=DT;}draw();requestAnimationFrame(frame);}
syncMenu();
requestAnimationFrame(frame);
</script></body></html>
