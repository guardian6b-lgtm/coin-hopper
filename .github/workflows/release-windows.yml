name: Release Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        working-directory: desktop
        run: npm ci

      - name: Copy root index.html into the app
        working-directory: desktop
        run: npm run copy-index

      - name: Build NSIS and portable executables
        working-directory: desktop
        run: npx electron-builder --win nsis portable
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: List built executables
        working-directory: desktop
        run: Get-ChildItem dist -Filter *.exe | Select-Object -ExpandProperty FullName

      - name: Upload executables to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/dist/*.exe
          fail_on_unmatched_files: true
