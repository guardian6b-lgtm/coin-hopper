name: Coin Hopper R6-S3 regressions

on:
  push:
    branches:
      - ci/manual-regressions-r6-s3

permissions:
  contents: read

concurrency:
  group: coin-hopper-r6-s3-regressions
  cancel-in-progress: true

jobs:
  regression-tests:
    name: Node.js regression suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out this branch
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run tests and preserve TAP report
        shell: bash
        run: |
          mkdir -p ci-reports
          set +e
          node --test --test-reporter=tap > ci-reports/node-tests.tap 2>&1
          status=$?
          set -e
          tail -n 60 ci-reports/node-tests.tap
          exit "$status"
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coin-hopper-r6-s3-tap
          path: ci-reports/node-tests.tap
          if-no-files-found: warn
          retention-days: 7
