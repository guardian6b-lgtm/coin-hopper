name: Gameplay checks

on:
  pull_request:
  push:
    branches:
      - "codex/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gameplay:
    name: Gameplay (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check original and expansion levels and gameplay
        run: node --test
      - name: Upload the self-contained browser preview
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coin-hopper-browser-preview
          path: |
            index.html
            docs/preview.md
          if-no-files-found: error
          retention-days: 7

  browser:
    name: Character, ability and enemy browser checks
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install isolated browser-test tools
        run: |
          echo "COIN_HOPPER_TEST_OUTPUT=$RUNNER_TEMP/coin-hopper-character-preview" >> "$GITHUB_ENV"
          npm install --prefix "$RUNNER_TEMP/coin-hopper-browser-tools" --no-save --package-lock=false playwright@1.62.0
          echo "NODE_PATH=$RUNNER_TEMP/coin-hopper-browser-tools/node_modules" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/coin-hopper-browser-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify selection, abilities, enemies and all five campaign routes
        run: node scripts/verify-browser.cjs
      - name: Include the standalone playable page
        if: always()
        run: |
          mkdir -p "$COIN_HOPPER_TEST_OUTPUT"
          cp index.html "$COIN_HOPPER_TEST_OUTPUT/index.html"
          cp docs/preview.md "$COIN_HOPPER_TEST_OUTPUT/README.md"
      - name: Upload character screenshots, results and playable preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skyline-summit-browser-evidence
          path: ${{ env.COIN_HOPPER_TEST_OUTPUT }}/
          if-no-files-found: error
          retention-days: 7
