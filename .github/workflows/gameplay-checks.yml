name: Gameplay checks

on:
  pull_request:
  push:
    branches:
      - "codex/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gameplay:
    name: Gameplay (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check original and expansion levels and gameplay
        run: node --test
      - name: Upload the self-contained browser preview
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coin-hopper-browser-preview
          path: |
            index.html
            docs/preview.md
            docs/art/stage-i/
            docs/art/reference/coin_hopper_character_selection.png
            docs/art/generated/characters-v1.png
            docs/stage-i-playtest.md
          if-no-files-found: error
          retention-days: 7

  browser:
    name: Character, ability and enemy browser checks
    if: github.event_name != 'push' || contains(fromJSON('["codex/sunny-meadow-art-prototype","codex/stage-i-prototypes"]'), github.ref_name)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install isolated browser-test tools
        run: |
          echo "COIN_HOPPER_TEST_OUTPUT=$RUNNER_TEMP/coin-hopper-character-preview" >> "$GITHUB_ENV"
          npm install --prefix "$RUNNER_TEMP/coin-hopper-browser-tools" --no-save --package-lock=false playwright@1.62.0
          echo "NODE_PATH=$RUNNER_TEMP/coin-hopper-browser-tools/node_modules" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/coin-hopper-browser-tools/node_modules/.bin/playwright" install --with-deps chromium webkit
      - name: Verify selection, abilities, enemies, all six campaign routes and visual comparisons
        run: node scripts/verify-browser.cjs
      - name: Verify Stage H mobile interaction and native-scale animations in Chromium and WebKit
        env:
          STAGE_H_WEBKIT: '1'
        run: node scripts/verify-stage-h.cjs
      - name: Verify isolated Hopper review and C3 preview in Chromium and WebKit
        env:
          STAGE_I_WEBKIT: '1'
        run: node scripts/verify-stage-i.cjs
      - name: Capture Stage I native comparisons and normal-input gait evidence
        env:
          STAGE_I_GAIT: '1'
        run: node scripts/capture-stage-i.cjs
      - name: Export original Guardian Foley samples
        run: node scripts/export-stage-i-audio.cjs "$COIN_HOPPER_TEST_OUTPUT/guardian-audio"
      - name: Capture exact Stage G comparisons and real normal-input footage
        run: node scripts/capture-stage-h.cjs
      - name: Export original owner listening samples
        run: node scripts/export-music.cjs "$COIN_HOPPER_TEST_OUTPUT/music-preview"
      - name: Capture owner-baseline comparisons and follow-up mechanics
        run: node scripts/capture-owner-followup.cjs
      - name: Include the standalone playable page
        if: always()
        run: |
          mkdir -p "$COIN_HOPPER_TEST_OUTPUT"
          cp index.html "$COIN_HOPPER_TEST_OUTPUT/index.html"
          cp docs/preview.md "$COIN_HOPPER_TEST_OUTPUT/README.md"
      - name: Upload character screenshots, results and playable preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: six-level-verification-browser-evidence
          path: ${{ env.COIN_HOPPER_TEST_OUTPUT }}/
          if-no-files-found: error
          retention-days: 7
